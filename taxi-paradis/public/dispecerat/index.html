<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Paradis - Dispecerat</title>

    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>

<header>

    <div class="logo">
        🚖 Taxi Paradis
    </div>

    <div class="titlu">
        DISPECERAT
    </div>

</header>

<main>

    <!-- STÂNGA -->

    <div class="coloana-stanga">

        <section class="panou comanda">

            <h2>Comandă nouă</h2>

            <input id="adresa" type="text" placeholder="Adresă">

            <input id="destinatie" type="text" placeholder="Destinație (opțional)">

            <input id="telefon" type="text" placeholder="Telefon (doar pentru exterior)">

            <textarea id="observatii" placeholder="Observații"></textarea>

            <button id="trimite">
                🚖 TRIMITE COMANDA
            </button>

        </section>


        <section class="panou">

            <button id="btnActive" class="folderComenzi">
    ▶ 📂 COMENZI ACTIVE
    <span id="nrActive">0</span>
</button>

            <div id="comenziActive"></div>

        </section>


        <section class="panou">

  <button id="btnIstoric" class="folderComenzi">
    ▶ 📂 ISTORIC COMENZI
    <span id="nrIstoric">0</span>
</button>

            <div id="istoricComenzi"></div>

        </section>

    </div>


    <!-- MIJLOC -->

    <section class="panou harta">

        <div id="map"></div>

    </section>


    <!-- DREAPTA -->

    <section class="panou">

        <h2>Stații</h2>

        <div id="statii">

            <div class="statie">
                <h3>GARA</h3>
                <div class="masini"></div>
            </div>

            <div class="statie">
                <h3>BCR</h3>
                <div class="masini"></div>
            </div>

            <div class="statie">
                <h3>HCC</h3>
                <div class="masini"></div>
            </div>

            <div class="statie">
                <h3>STATIA1</h3>
                <div class="masini"></div>
            </div>

            <div class="statie">
                <h3>STATIA2</h3>
                <div class="masini"></div>
            </div>

            <div class="statie">
                <h3>STATIA3</h3>
                <div class="masini"></div>
            </div>

            <div class="statie">
                <h3>REZI</h3>
                <div class="masini"></div>
            </div>

            <div class="statie">
                <h3>PARC</h3>
                <div class="masini"></div>
            </div>

            <div class="statie">
                <h3>ELENA DOAMNA</h3>
                <div class="masini"></div>
            </div>

            <div class="statie">
                <h3>TÂRGU VECHI</h3>
                <div class="masini"></div>
            </div>

            <div class="statie">
                <h3>LIBER</h3>
                <div class="masini"></div>
            </div>

        </div>

    </section>

</main>

<div id="fundalDetalii"></div>

<div id="detaliiComanda">

<h2>🚖 Detalii comandă</h2>

<div id="continutDetalii"></div>

<button id="inchideDetalii">
Închide
</button>

</div>

<script src="script.js"></script>

</body>
</html>
